<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentenanță Echipamente PWA</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Dexie.js pentru stocare locală IndexedDB -->
  <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>

  <!-- Manifest PWA -->
  <link rel="manifest" href='data:application/json,{"name":"Mentenanta Echipamente","short_name":"Mentenanta","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a"}'>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center">

  <header class="w-full max-w-md border-b border-slate-700 pb-3 mb-4 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold text-amber-400">Mentenanță Electrică</h1>
      <p class="text-xs text-slate-400">PWA Local-First</p>
    </div>
    <span class="text-xs px-2 py-1 bg-emerald-900/60 text-emerald-400 rounded border border-emerald-700/50">Online / Offline</span>
  </header>

  <main class="w-full max-w-md space-y-6">

    <!-- TAB-URI -->
    <div class="flex border-b border-slate-700 text-sm">
      <button onclick="switchTab('interventions')" id="tabBtnInterventions" class="flex-1 py-2 font-semibold text-amber-400 border-b-2 border-amber-400">Jurnal Intervenții</button>
      <button onclick="switchTab('equipment')" id="tabBtnEquipment" class="flex-1 py-2 font-semibold text-slate-400">Echipamente & Linii</button>
    </div>

    <!-- SECTIUNEA 1: JURNAL INTERVENTII -->
    <section id="sectionInterventions" class="space-y-4">
      
      <!-- Formular Intervenție Nouă -->
      <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 space-y-3">
        <h2 class="text-sm font-bold text-slate-200">Adaugă Intervenție / Defect</h2>
        
        <div>
          <label class="block text-xs text-slate-400 mb-1">Selectează Echipament</label>
          <select id="selectEquipment" class="w-full p-2 bg-slate-900 border border-slate-600 rounded text-sm focus:outline-none focus:border-amber-400 text-slate-100">
            <!-- Populat dinamic -->
          </select>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Descriere Defect / Lucrare</label>
          <textarea id="defectDesc" rows="2" placeholder="ex: Bornă arsă la contactorul principal" class="w-full p-2 bg-slate-900 border border-slate-600 rounded text-sm focus:outline-none focus:border-amber-400 text-slate-100"></textarea>
        </div>

        <!-- Zonă Captură Foto Defect -->
        <div class="space-y-2">
          <label class="block text-xs text-slate-400">Foto Defect (Opțional)</label>
          
          <video id="videoDefect" autoplay playsinline class="w-full bg-black rounded hidden border border-slate-700 h-48 object-cover"></video>
          <canvas id="canvasDefect" class="hidden"></canvas>
          <img id="photoDefectPreview" class="w-full rounded hidden border border-amber-400/50 h-48 object-cover">

          <div class="flex gap-2">
            <button type="button" id="startCamBtn" onclick="initCamera()" class="flex-1 py-2 bg-slate-700 text-xs font-medium rounded hover:bg-slate-600">
              Deschide Camera
            </button>
            <button type="button" id="captureBtn" onclick="takePhoto()" class="flex-1 py-2 bg-amber-500 text-slate-900 text-xs font-bold rounded hidden">
              Capturează Foto
            </button>
          </div>
          
          <!-- Fallback input nativ file/camera -->
          <input type="file" id="fileFallback" accept="image/*" capture="environment" class="hidden" onchange="handleFileSelect(event)">
        </div>

        <button type="button" onclick="saveIntervention()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded text-sm mt-2">
          Salvează în Jurnal
        </button>
      </div>

      <!-- Lista Intervențiilor -->
      <div class="space-y-2">
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Istoric Intervenții</h3>
        <div id="interventionsList" class="space-y-3"></div>
      </div>
    </section>

    <!-- SECTIUNEA 2: ECHIPAMENTE SI LINII -->
    <section id="sectionEquipment" class="space-y-4 hidden">
      
      <!-- Adăugare Echipament Nou -->
      <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 space-y-3">
        <h2 class="text-sm font-bold text-slate-200">Echipament Nou</h2>
        
        <input type="text" id="eqName" placeholder="Nume Mașină / Utilaj" class="w-full p-2 bg-slate-900 border border-slate-600 rounded text-sm focus:outline-none focus:border-amber-400 text-slate-100">
        <input type="text" id="eqLine" placeholder="Linia inițială (ex: Linia 1)" class="w-full p-2 bg-slate-900 border border-slate-600 rounded text-sm focus:outline-none focus:border-amber-400 text-slate-100">
        
        <button type="button" onclick="saveEquipment()" class="w-full py-2 bg-amber-500 text-slate-900 font-bold rounded text-sm">
          Adaugă Echipament
        </button>
      </div>

      <!-- Lista Echipamentelor -->
      <div class="space-y-2">
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Echipamente Înregistrate</h3>
        <div id="equipmentList" class="space-y-3"></div>
      </div>
    </section>

  </main>

  <script>
    // Configurare Dexie DB
    let db;
    try {
      db = new Dexie("MentenantaDB_App");
      db.version(1).stores({
        equipment: '++id, name, currentLine',
        lineHistory: '++id, equipmentId, fromLine, toLine, date',
        interventions: '++id, equipmentId, equipmentName, lineAtEvent, description, photoDefect, photoResolution, date'
      });
    } catch (e) {
      console.error("Dexie error:", e);
    }

    let currentPhotoDefect = null;
    let videoStream = null;

    function switchTab(tab) {
      document.getElementById('sectionInterventions').classList.toggle('hidden', tab !== 'interventions');
      document.getElementById('sectionEquipment').classList.toggle('hidden', tab !== 'equipment');
      
      document.getElementById('tabBtnInterventions').className = tab === 'interventions' ? 'flex-1 py-2 font-semibold text-amber-400 border-b-2 border-amber-400' : 'flex-1 py-2 font-semibold text-slate-400';
      document.getElementById('tabBtnEquipment').className = tab === 'equipment' ? 'flex-1 py-2 font-semibold text-amber-400 border-b-2 border-amber-400' : 'flex-1 py-2 font-semibold text-slate-400';
    }

    // Control Camera cu Fallback Nativ
    async function initCamera() {
      const video = document.getElementById('videoDefect');
      const startBtn = document.getElementById('startCamBtn');
      const captureBtn = document.getElementById('captureBtn');

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        document.getElementById('fileFallback').click();
        return;
      }

      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        video.srcObject = videoStream;
        video.classList.remove('hidden');
        startBtn.classList.add('hidden');
        captureBtn.classList.remove('hidden');
      } catch (err) {
        document.getElementById('fileFallback').click();
      }
    }

    function takePhoto() {
      const video = document.getElementById('videoDefect');
      const canvas = document.getElementById('canvasDefect');
      const preview = document.getElementById('photoDefectPreview');
      const captureBtn = document.getElementById('captureBtn');

      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      canvas.getContext('2d').drawImage(video, 0, 0);

      currentPhotoDefect = canvas.toDataURL('image/jpeg', 0.7);
      preview.src = currentPhotoDefect;
      preview.classList.remove('hidden');
      video.classList.add('hidden');
      captureBtn.classList.add('hidden');

      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        currentPhotoDefect = e.target.result;
        const preview = document.getElementById('photoDefectPreview');
        preview.src = currentPhotoDefect;
        preview.classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    // Salvare Echipament Nou
    async function saveEquipment() {
      const name = document.getElementById('eqName').value.trim();
      const line = document.getElementById('eqLine').value.trim();

      if (!name || !line) {
        alert("Introdu numele echipamentului și linia!");
        return;
      }

      await db.equipment.add({ name: name, currentLine: line });
      document.getElementById('eqName').value = '';
      document.getElementById('eqLine').value = '';
      
      renderAll();
    }

    // Editare Nume Echipament
    async function editEquipmentName(equipmentId, oldName) {
      const newName = prompt(`Modifică numele echipamentului:`, oldName);
      if (!newName || newName.trim() === '' || newName.trim() === oldName) return;

      const trimmedName = newName.trim();
      await db.equipment.update(equipmentId, { name: trimmedName });

      // Actualizează numele echipamentului și în intervențiile viitoare legate
      renderAll();
    }

    // Transfer pe altă linie
    async function transferEquipment(equipmentId, oldLine) {
      const newLine = prompt(`Linia curentă: "${oldLine}". Introdu noua linie:`);
      if (!newLine || newLine.trim() === '' || newLine.trim() === oldLine) return;

      await db.equipment.update(equipmentId, { currentLine: newLine.trim() });
      await db.lineHistory.add({
        equipmentId: equipmentId,
        fromLine: oldLine,
        toLine: newLine.trim(),
        date: new Date().toLocaleString('ro-RO')
      });

      renderAll();
    }

    // Salvare Intervenție
    async function saveIntervention() {
      const eqSelect = document.getElementById('selectEquipment');
      const eqId = parseInt(eqSelect.value);
      const description = document.getElementById('defectDesc').value.trim();

      if (!eqId || !description) {
        alert("Selectează echipamentul și adaugă o descriere!");
        return;
      }

      const eq = await db.equipment.get(eqId);

      await db.interventions.add({
        equipmentId: eq.id,
        equipmentName: eq.name,
        lineAtEvent: eq.currentLine,
        description: description,
        photoDefect: currentPhotoDefect,
        photoResolution: null,
        date: new Date().toLocaleString('ro-RO')
      });

      document.getElementById('defectDesc').value = '';
      document.getElementById('photoDefectPreview').classList.add('hidden');
      document.getElementById('startCamBtn').classList.remove('hidden');
      currentPhotoDefect = null;

      renderAll();
    }

    // Poză Rezolvare
    async function addResolutionPhoto(interventionId) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.capture = 'environment';

      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event)
